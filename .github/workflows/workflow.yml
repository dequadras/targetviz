name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core Python versions (default pandas)
          - python-version: '3.9'
            extra-deps: ''
          - python-version: '3.10'
            extra-deps: ''
          - python-version: '3.11'
            extra-deps: ''
          - python-version: '3.12'
            extra-deps: ''
          # With pyarrow
          - python-version: '3.12'
            extra-deps: 'pyarrow'
          - python-version: '3.13'
            extra-deps: 'pyarrow'
          # pandas 3 compatibility
          - python-version: '3.12'
            extra-deps: 'pyarrow pandas>=3.0'
          - python-version: '3.13'
            extra-deps: 'pyarrow pandas>=3.0'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit pytest
        pip install -e .  # Install the package in editable mode
        if [ -n "${{ matrix.extra-deps }}" ]; then
          pip install ${{ matrix.extra-deps }}
        fi
    - name: Run pre-commit hooks
      if: matrix.python-version == '3.12' && matrix.extra-deps == ''
      run: pre-commit run --all-files
    - name: Run tests
      run: pytest tests -v
