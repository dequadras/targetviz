name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Core Python versions (default pandas)
          - python-version: '3.9'
            extra-deps: ''
          - python-version: '3.10'
            extra-deps: ''
          - python-version: '3.11'
            extra-deps: ''
          - python-version: '3.12'
            extra-deps: ''
          # With pyarrow
          - python-version: '3.12'
            extra-deps: 'pyarrow'
          - python-version: '3.13'
            extra-deps: 'pyarrow'
          # pandas 3 compatibility
          - python-version: '3.12'
            extra-deps: 'pyarrow pandas>=3.0'
          - python-version: '3.13'
            extra-deps: 'pyarrow pandas>=3.0'

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        if [ -n "${{ matrix.extra-deps }}" ]; then
          pip install ${{ matrix.extra-deps }}
        fi
    - name: Run pre-commit hooks
      if: matrix.python-version == '3.12' && matrix.extra-deps == ''
      run: pre-commit run --all-files
    - name: Run tests
      run: pytest tests -v

  benchmark:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Restore benchmark baseline
      uses: actions/cache@v4
      with:
        path: .benchmarks
        key: benchmark-${{ runner.os }}-py3.12
    - name: Run benchmarks
      run: |
        pytest tests/test_benchmarks.py tests/test_benchmarks_plot.py \
          --benchmark-enable \
          --benchmark-only \
          --benchmark-save=current \
          --benchmark-compare \
          --benchmark-compare-fail=mean:30% \
          -v
    - name: Save benchmark baseline
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        # Promote current run as the baseline for future comparisons
        cp -f .benchmarks/*current*.json .benchmarks/baseline.json 2>/dev/null || true
