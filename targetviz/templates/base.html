<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TargetViz Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        h1, h2 {
            color: #333;
        }
        .flex-container {
            display: flex;
            justify-content: space-between;
            gap: 2%;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .histogram {
            width: 48%;
            min-width: 0;
            overflow: hidden;
        }
        .histogram svg {
            width: 100%;
            height: auto;
            display: block;
        }
        .table-container {
            width: 48%;
            min-width: 0;
            overflow: auto;
        }
        .rel-fig-container {
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .rel-fig-container svg {
            width: 100%;
            height: auto;
            display: block;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 4px;
            text-align: left;
            line-height: 1.2;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>
    <h1>Analysis of the Relationship of Variables to a Target Variable</h1>

    <div>
        <h2>TARGET</h2>
        <div class="flex-container">
            <div class="histogram">
                {{ result_dict.target_histogram | safe }}
            </div>
            <div class="table-container">
                {{ result_dict.target_table | safe }}
            </div>
        </div>
